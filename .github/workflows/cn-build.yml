# 国内增强版专用构建：不依赖官方版权资产，不走官方签名门禁。
#
# 与上游 Build-XQDK(android.yml) 的区别：
#  - 不下载 assets Release 里的 ONNX 模型 / 桔库开局库，也不做 sha256 自检。
#    这些资产受版权保护不随源码分发；缺失时 App 按 README 约定自动降级
#    （识别回退 YOLO、连线降级纯引擎），不影响编译与基本使用。
#  - 不注入官方签名密钥；v1.15 起注入**本分支自己的固定 release 密钥**
#    （Secrets: ANDROID_KEYSTORE_B64 / CCHES_STORE_PWD / CCHES_KEY_PWD），
#    出包前用 apksigner 比对证书指纹硬门禁，不一致直接失败 —— 保证各版本可覆盖安装。
#    （v1.14 及以前实际回退到全新 runner 自动生成的 debug.keystore，每版签名都不同，
#     用户每次都必须卸载重装；已由 Signing audit 实测确认。）
#  - 手动触发时由 runner 直接把 APK 挂到 Release 页（不经沙盒中转运大文件）；
#    用 gh release create 而非推送 v* tag，避免命中 android.yml 的 tags: ["v*"]。
#    本分支标签统一用 cn- 前缀（如 cn-1.16），天然不命中该规则。
#
# 触发：push 到 main（常规开发，仅编译+单测+出 artifact）或手动 workflow_dispatch（发布）。
name: Build-CN

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布到 Release 页（填 false 则只构建不发布）'
        type: string
        required: false
        default: 'true'
      release_tag:
        description: 'Release 标签名（cn- 前缀，不以 v 开头，避免触发上游 Build-XQDK 流水线）'
        type: string
        required: false
        default: 'cn-1.16'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # versionCode / versionName 由 git 提交数与 cn-* 标签派生，需完整历史
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # runner 预装 SDK 未必含 compileSdk 34 与钉定的 NDK 25.1，先接受 license
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      # v1.15 固定签名（根治「每次都要卸载重装」）：
      # 之前只恢复了 $HOME/.android/debug.keystore，但 gradle 的 release 配置缺
      # local.properties 时仍回退 debug 签名；全新 runner 会生成一把新钥匙，
      # Signing audit 实测 cn-1.12/1.13/1.14 三个包证书 SHA-256 全不相同。
      # 现在显式注入本分支 release 密钥（jks + 两个密码），让 build.gradle.kts
      # 走 signingConfigs.release，不再有任何隐式回退；缺任一 Secret 直接失败。
      - name: Restore fixed release signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CCHES_STORE_PWD: ${{ secrets.CCHES_STORE_PWD }}
          CCHES_KEY_PWD: ${{ secrets.CCHES_KEY_PWD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_B64:-}" ] || [ -z "${CCHES_STORE_PWD:-}" ] || [ -z "${CCHES_KEY_PWD:-}" ]; then
            echo "::error::固定签名密钥 Secrets 未配齐，禁止出包（否则又是一把新钥匙，用户又得卸载重装）"
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > app/cchess.release.2026.jks
          printf 'CCHES_STORE_PWD=%s\nCCHES_KEY_PWD=%s\n' "$CCHES_STORE_PWD" "$CCHES_KEY_PWD" > local.properties
          keytool -list -keystore app/cchess.release.2026.jks -storepass "$CCHES_STORE_PWD" -alias cchess2026 >/dev/null
          echo "固定 release 钥匙已注入（alias=cchess2026）；私钥不入库、不进日志"

      - name: Unit tests
        # 失败时把关键错误行回传成 check-run annotations：无需下载被网络策略拦截的
        # 日志 blob，从 GitHub API 就能读到编译/断言失败原因（排障用，长期保留）
        run: |
          set -o pipefail
          if ! bash gradlew :app:testArmv8-dotprodDebugUnitTest --no-daemon --console=plain 2>&1 | tee /tmp/unit.log; then
            echo "::group::单测失败摘要"
            grep -E '^e: |FAILED|FAILURE:|What went wrong|Unresolved reference|Type mismatch|error:|Execution failed|Caused by:|AssertionError|expected:|but was:|> Task .* FAILED' /tmp/unit.log | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::endgroup::"
            exit 1
          fi

      - name: 点棋盘链路自检（打包前必须走通）
        # 用户要求「打包之前自己过一遍流程：模拟点点击，看它触发了什么、反馈给我什么」。
        # 跑 TapChainTest（-i 让 println 进日志），把 [点按链路] 每一步回传成 check-run
        # notice；测试失败 / 报告缺失则本步骤失败，Assemble 不会执行 → 不出坏包。
        run: |
          set -o pipefail
          bash gradlew :app:testArmv8-dotprodDebugUnitTest \
            --tests "com.xqdk.chess.assist.TapChainTest" \
            --no-daemon --console=plain -i 2>&1 | tee /tmp/tap_chain.log
          if ! grep -q '链路自检通过' /tmp/tap_chain.log; then
            echo "::error::链路自检报告缺失：TapChainTest 可能没真正执行，禁止出包"
            exit 1
          fi
          # v1.12 起：断言逐版累积，head -20 会把新增门禁的回传截掉（v1.12 第一次
          # 发布只回传 10 条、漏了「单帧合法性门槛 / 一键关录屏兜底」）。放宽到 40，
          # 保证「打包前自己过一遍」的报告每条都能在 annotations 里核对到。
          grep '\[点按链路\]' /tmp/tap_chain.log | head -40 | while IFS= read -r line; do
            echo "::notice::$line"
          done

      - name: Assemble Release APKs
        run: bash gradlew assembleArmv8Release assembleArmv8-dotprodRelease --no-daemon --console=plain

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist

      # v1.4 包名锁定门禁：任何改动 applicationId 的提交都不得出包
      # （包名一变就是另一个 App，固定签名也没法覆盖升级）
      - name: Verify fixed applicationId
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          AAPT="$BT/aapt"
          [ -x "$AAPT" ] || { echo "::error::未找到 aapt，无法校验包名"; exit 1; }
          for f in dist/*.apk; do
            ID="$("$AAPT" dump badging "$f" | head -1 | sed -E "s/^package: name='([^']+)'.*/\1/")"
            echo "$f -> applicationId=$ID"
            if [ "$ID" != "com.xqdk.chess" ]; then
              echo "::error::包名被改动（$ID），必须固定为 com.xqdk.chess"
              exit 1
            fi
          done

      # v1.15 硬门禁：只「打印」指纹挡不住漂移（v1.14 及以前就是打印完照发）。
      # 现在把每个 APK 的证书 SHA-256 与 docs/SIGNING_FINGERPRINT.txt 逐一比对，
      # 不一致直接失败并回传 error —— 从机制上保证以后每版都能覆盖安装。
      - name: Verify fixed signing certificate
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          EXPECTED="$(tr -d '[:space:]' < docs/SIGNING_FINGERPRINT.txt)"
          for f in dist/*.apk; do
            FP="$("$BT/apksigner" verify --print-certs "$f" \
              | grep 'SHA-256 digest:' | head -1 | awk '{print $NF}' | tr -d ':' | tr -d '[:space:]')"
            echo "::notice::签名指纹 $(basename "$f") = $FP"
            if [ "$FP" != "$EXPECTED" ]; then
              echo "::error::签名证书与固定钥匙不一致（$FP != $EXPECTED）；本包会让用户必须卸载重装，禁止发布"
              exit 1
            fi
          done
          echo "签名一致：全部 APK 均由固定钥匙签出，可覆盖安装"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: XQDK-cn-apks
          path: dist/*.apk
          if-no-files-found: error

      # 手动触发时在 runner 内直接把 APK 挂到 Release 页，产物不经沙盒中转。
      - name: Publish to Release page
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: '象棋迪克 XQDK · 国内增强版 v1.16'
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-cn-1.16}"
          echo "发布标签: $TAG"
          echo "产物清单:"
          ls -lh dist/
          # 幂等：同名 Release 已存在则先删除旧资产，再重建
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "同名 Release 已存在，删除后重建"
            # 不删 tag：保留预建标签，git describe 才能给出干净的 versionName
            gh release delete "$TAG" --yes
          fi
          # cn-1.13 重建起：Release 正文只放极简摘要。之前用整份 docs/RELEASE.md
          # （累积全部版本历史，cn-1.13 时 364 行），正文把 Assets 下载区压到屏幕外，
          # 用户要一直往下翻才能找到安装包。改成短模板 + <details> 折叠 +
          # 超链接引到仓库里的完整文档；Assets 紧跟正文，不用翻。
          VER="${TAG#cn-}"
          sed "s/{{TAG}}/$TAG/g; s/{{VER}}/$VER/g" docs/RELEASE_BRIEF.md > /tmp/release_brief.md
          gh release create "$TAG" dist/*.apk \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_brief.md \
            --latest
          echo "=== Release 资产 ==="
          gh release view "$TAG" --json tagName,url,assets \
            --jq '"URL: " + .url, (.assets[] | "  - " + .name + " (" + (.size|tostring) + " bytes)")'
