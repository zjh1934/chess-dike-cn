# 语音提示分支专用构建：不依赖官方版权资产，不走官方签名门禁。
#
# 与 Build-XQDK(android.yml) 的区别：
#  - 不下载 assets Release 里的 ONNX 模型 / 桔库开局库，也不做 sha256 自检。
#    这些资产受版权保护不随源码分发；缺失时 App 按 README 约定自动降级
#    （识别回退 YOLO、连线降级纯引擎），不影响编译与基本使用。
#  - 不注入官方签名密钥，release 构建由 app/build.gradle.kts 回退 debug 签名，
#    产物可直接安装，但不能覆盖安装官方签名版。
#  - 不做 tag 发布、不挂 Release，只上传 artifact 供下载。
#
# 触发：push 到 main（常规开发）或手动 workflow_dispatch（补包/重跑）。
name: Build-Voice

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布到 Release 页（填 false 则只构建不发布）'
        type: string
        required: false
        default: 'true'
      release_tag:
        description: 'Release 标签名（不以 v 开头，避免触发官方 Build-XQDK 流水线）'
        type: string
        required: false
        default: 'voice-1.0'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # versionCode / versionName 由 git 提交数与 v* 标签派生，需完整历史
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # runner 预装 SDK 未必含 compileSdk 34 与钉定的 NDK 25.1，先接受 license
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Unit tests
        run: bash gradlew :app:testArmv8-dotprodDebugUnitTest --no-daemon --console=plain

      - name: Assemble Release APKs
        run: bash gradlew assembleArmv8Release assembleArmv8-dotprodRelease --no-daemon --console=plain

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: XQDK-voice-apks
          path: dist/*.apk
          if-no-files-found: error

      # 手动触发时在 runner 内直接把 APK 挂到 Release 页，产物不经沙盒中转。
      # 用 gh release create 而非 tag 推送：避免命中 android.yml 的 tags: ["v*"]。
      - name: Publish to Release page
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: '象棋迪克 XQDK · 支招语音提示版'
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-voice-1.0}"
          echo "发布标签: $TAG"
          echo "产物清单:"
          ls -lh dist/
          # 幂等：同名 Release 已存在则先删除旧资产，再重建
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "同名 Release 已存在，删除后重建"
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" dist/*.apk \
            --title "$RELEASE_TITLE" \
            --notes-file docs/RELEASE_VOICE.md \
            --latest
          echo "=== Release 资产 ==="
          gh release view "$TAG" --json tagName,url,assets \
            --jq '"URL: " + .url, (.assets[] | "  - " + .name + " (" + (.size|tostring) + " bytes)")'
