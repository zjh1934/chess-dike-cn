name: Signing audit
# 一次性诊断：用户实测每个版本都要卸载才能装，不能覆盖安装。
# 沙盒出口被拦，改由 GitHub runner 下载历次 Release 的 APK，
# 用 apksigner/aapt 打印真实证书指纹与包名/versionCode，回传成 notice 供核对。
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compare published APK identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          mkdir -p /tmp/audit && cd /tmp/audit
          for tag in cn-1.12 cn-1.13 cn-1.14; do
            mkdir -p "$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern '*armv8-dotprod-release.apk' --dir "$tag" --clobber
            f="$(ls "$tag"/*.apk | head -1)"
            fp="$("$BT/apksigner" verify --print-certs "$f" | grep 'SHA-256 digest:' | head -1 | awk '{print $NF}')"
            badging="$("$BT/aapt" dump badging "$f" | head -1)"
            id="$(printf '%s' "$badging" | sed -E "s/^package: name='([^']+)'.*/\1/")"
            vc="$(printf '%s' "$badging" | sed -E "s/.*versionCode='([^']+)'.*/\1/")"
            vn="$(printf '%s' "$badging" | sed -E "s/.*versionName='([^']+)'.*/\1/")"
            echo "::notice::SIGAUDIT $tag | id=$id vc=$vc vn=$vn | cert=$fp"
          done
